<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW Mesajlaşma</title><style>body{font-family:system-ui;background:#08111f;color:#e8eef8;margin:0;padding:24px}.card{max-width:920px;margin:auto;background:#111c2e;padding:24px;border:1px solid #2b3d57;border-radius:18px}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.btn,button{padding:10px 16px;border:0;border-radius:10px;background:#0ea5e9;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#334155}.muted{color:#9db0ca}.badge{padding:6px 10px;border-radius:999px;background:#7f1d1d}.online{background:#14532d}#messages{height:55vh;overflow:auto;background:#050b16;border:1px solid #2b3d57;border-radius:12px;padding:12px;margin:16px 0}.msg{padding:8px 10px;border-left:3px solid #38bdf8;background:#101b2f;border-radius:5px;margin-bottom:8px;white-space:pre-wrap}input{flex:1;min-width:220px;padding:12px;background:#07101e;color:#fff;border:1px solid #3a4d69;border-radius:10px}.error{color:#fca5a5;min-height:22px}</style></head><body><main class="card"><div class="top"><div><h1>SAW Mesajlaşma</h1><p class="muted">Oturum: <strong id="user">-</strong> · İstemci: <strong id="client">-</strong></p></div><div class="row"><span id="conn" class="badge">Bağlanıyor</span><a class="btn secondary" href="/panel">Panel</a></div></div><div id="messages"></div><form id="f" class="row"><input id="m" maxlength="1023" placeholder="Mesaj yazın" required><button>Gönder</button><button id="zip" type="button" class="secondary">Zip Oluştur</button></form><div id="err" class="error"></div></main><script>'use strict';const box=document.querySelector('#messages'),err=document.querySelector('#err'),conn=document.querySelector('#conn');function add(t){if(!t)return;const d=document.createElement('div');d.className='msg';d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}async function init(){const sr=await fetch('/api/session');if(!sr.ok){location.replace('/login');return}const sd=await sr.json();document.querySelector('#user').textContent=sd.username;const hr=await fetch('/api/chat-history');if(hr.ok){const text=await hr.text();text.split('\n').filter(Boolean).forEach(add)}else err.textContent=`Geçmiş yüklenemedi (${hr.status})`;connect()}function connect(){const scheme=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${scheme}://${location.host}/ws`);window.ws=ws;ws.onopen=()=>{conn.textContent='Bağlı';conn.classList.add('online')};ws.onmessage=e=>{const t=String(e.data);if(t.startsWith('@client:')){document.querySelector('#client').textContent=t.slice(8);return}if(t.startsWith('@status:'))return;add(t)};ws.onclose=()=>{conn.textContent='Bağlantı kapalı';conn.classList.remove('online')};ws.onerror=()=>{err.textContent='WebSocket bağlantı hatası'}}document.querySelector('#f').onsubmit=e=>{e.preventDefault();err.textContent='';const t=document.querySelector('#m').value.trim();if(!t)return;if(!window.ws||window.ws.readyState!==WebSocket.OPEN){err.textContent='Mesaj gönderilemedi: bağlantı açık değil.';return}window.ws.send(t);document.querySelector('#m').value=''};document.querySelector('#zip').onclick=async()=>{err.textContent='';try{const r=await fetch('/api/zip',{method:'POST'});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||`ZIP hatası (${r.status})`);window.location='/download/log.zip'}catch(e){err.textContent=e.message}};init().catch(()=>{err.textContent='Sayfa başlatılamadı.'});</script></body></html>
