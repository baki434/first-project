<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW Panel</title><style>body{font-family:system-ui;background:#08111f;color:#e8eef8;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(760px,92%);background:#111c2e;padding:28px;border:1px solid #2b3d57;border-radius:18px}.row{display:flex;gap:12px;flex-wrap:wrap}.btn,button{padding:13px 20px;border-radius:10px;border:0;background:#0ea5e9;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#334155}.muted{color:#9db0ca}</style></head><body><main class="card"><h1>SAW Kontrol Paneli</h1><p class="muted">Kullanıcı: <strong id="user">-</strong></p><div class="row"><a class="btn" href="/mesajlasma">Mesajlaşma</a><a class="btn" href="/saw">SAW</a><button id="out" class="secondary">Çıkış</button></div></main><script>'use strict';(async()=>{const r=await fetch('/api/session');if(!r.ok){location.replace('/login');return}const d=await r.json();document.querySelector('#user').textContent=d.username})();document.querySelector('#out').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.replace('/login')};</script></body></html>
