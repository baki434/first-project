<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW Log</title><style>body{font-family:system-ui;background:#08111f;color:#e8eef8;margin:0;padding:24px}.card{max-width:1000px;margin:auto;background:#111c2e;padding:24px;border:1px solid #2b3d57;border-radius:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn,button{padding:10px 16px;border:0;border-radius:10px;background:#0ea5e9;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#334155}.muted{color:#9db0ca}pre{white-space:pre-wrap;word-break:break-word;background:#050b16;border:1px solid #2b3d57;border-radius:12px;padding:16px;min-height:55vh;max-height:68vh;overflow:auto}.error{color:#fca5a5;min-height:22px}</style></head><body><main class="card"><div class="top"><div><h1>SAW Sunucu Logları</h1><p class="muted">Sunucuda oluşan kayıtların salt okunur görünümü.</p></div><div><button id="refresh">Yenile</button> <a class="btn secondary" href="/login">Giriş</a></div></div><pre id="out">Log yükleniyor…</pre><div id="err" class="error"></div></main><script>'use strict';const out=document.querySelector('#out'),err=document.querySelector('#err');async function loadLog(){err.textContent='';try{const r=await fetch('/api/log',{cache:'no-store'});const text=await r.text();if(!r.ok){let msg=text;try{const j=JSON.parse(text);msg=j.error||msg}catch(_){}throw new Error(msg||`Log hatası (${r.status})`)}out.textContent=text||'Henüz log kaydı yok.';out.scrollTop=out.scrollHeight}catch(e){out.textContent='';err.textContent=e.message||'Log yüklenemedi.'}}document.querySelector('#refresh').onclick=loadLog;loadLog();</script></body></html>
