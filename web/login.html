<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW Giriş</title>
<style>body{font-family:system-ui;background:#08111f;color:#e8eef8;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(430px,90%);background:#111c2e;padding:28px;border:1px solid #2b3d57;border-radius:18px}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border-radius:10px;font:inherit}input{background:#07101e;color:#fff;border:1px solid #3a4d69}button{background:#0ea5e9;color:white;border:0;font-weight:700;cursor:pointer}.status{min-height:24px;margin-top:14px;color:#fca5a5}.muted{color:#9db0ca}</style></head><body><main class="card"><h1>SAW Web Girişi</h1><p class="muted">Devam etmek için giriş yapın.</p><form id="f"><input id="u" placeholder="Kullanıcı adı" autocomplete="username" required><input id="p" type="password" placeholder="Şifre" autocomplete="current-password" required><button>Giriş yap</button><div id="s" class="status"></div></form></main>
<script>'use strict';const f=document.querySelector('#f'),s=document.querySelector('#s');let redirectTimer=null;async function check(){try{const r=await fetch('/api/session',{credentials:'same-origin'});if(r.ok){const d=await r.json();if(d.authenticated){location.replace('/panel');return}}redirectTimer=setTimeout(()=>location.replace('/status'),10000)}catch(_){s.textContent='Oturum kontrolü yapılamadı.';redirectTimer=setTimeout(()=>location.replace('/status'),10000)}}check();f.addEventListener('submit',async e=>{e.preventDefault();if(redirectTimer)clearTimeout(redirectTimer);s.textContent='Giriş kontrol ediliyor…';try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#u').value.trim(),password:document.querySelector('#p').value})});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||`Hata (${r.status})`);location.replace('/panel')}catch(err){s.textContent=err.message||'Sunucuya ulaşılamadı'}});</script></body></html>
