<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW</title><style>body{font-family:system-ui;background:#08111f;color:#e8eef8;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(760px,92%);background:#111c2e;padding:28px;border:1px solid #2b3d57;border-radius:18px}button,.btn{padding:11px 17px;border:0;border-radius:10px;background:#0ea5e9;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}pre{white-space:pre-wrap;background:#050b16;padding:16px;border-radius:12px;min-height:120px}.error{color:#fca5a5}</style></head><body><main class="card"><h1>SAW İşlemleri</h1><div class="row"><button data-cmd="saw help">Help</button><button data-cmd="saw info">Info</button><a class="btn" href="/panel">Panel</a></div><pre id="out">Bir seçenek seçin.</pre><div id="err" class="error"></div></main><script>'use strict';(async()=>{if(!(await fetch('/api/session')).ok)location.replace('/login')})();document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=async()=>{const out=document.querySelector('#out'),err=document.querySelector('#err');err.textContent='';try{const r=await fetch('/api/saw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:b.dataset.cmd})});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||`Hata (${r.status})`);out.textContent=d.output}catch(e){err.textContent=e.message}});</script></body></html>
