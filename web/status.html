<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW Durum</title>
<style>body{font-family:system-ui;background:#08111f;color:#e8eef8;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(620px,92%);background:#111c2e;padding:28px;border:1px solid #2b3d57;border-radius:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.ok{display:inline-block;padding:6px 10px;border-radius:999px;background:#14532d;color:#dcfce7;font-weight:700}.muted{color:#9db0ca}.btn{display:inline-block;padding:12px 18px;border-radius:10px;background:#0ea5e9;color:#fff;font-weight:700;text-decoration:none}.info{background:#07101e;border:1px solid #2b3d57;border-radius:12px;padding:16px;margin:18px 0}.error{color:#fca5a5;min-height:22px}</style></head><body><main class="card"><h1>SAW Web Server</h1><p class="muted">Bu ekran giriş yapmamış kullanıcıya yalnızca genel sistem durumunu gösterir.</p><div class="info"><p>Sunucu durumu: <span id="server" class="ok">Kontrol ediliyor...</span></p><p>Bağlantı: <strong id="secure">-</strong></p><p>Yetkili bölümlere erişmek için giriş yapmanız gerekir.</p></div><div class="row"><a class="btn" href="/login">Giriş Yap</a></div><div id="err" class="error"></div></main><script>'use strict';const server=document.querySelector('#server'),secure=document.querySelector('#secure'),err=document.querySelector('#err');secure.textContent=location.protocol==='https:'?'Güvenli (HTTPS)':'Şifrelenmemiş (HTTP)';fetch('/health',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`Durum kontrolü başarısız (${r.status})`);server.textContent='Çalışıyor'}).catch(e=>{server.textContent='Ulaşılamıyor';server.style.background='#7f1d1d';err.textContent=e.message});</script></body></html>
